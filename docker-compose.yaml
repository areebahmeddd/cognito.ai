  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.4
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - logger.level=WARN
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mongodb:
    image: mongo:noble
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=cases
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

