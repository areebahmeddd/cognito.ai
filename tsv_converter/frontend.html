<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSV Converter - Forensic Report Processor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .content {
            padding: 40px;
        }

        .upload-section {
            border: 3px dashed #e0e0e0;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .upload-section:hover {
            border-color: #667eea;
            background-color: #f8f9ff;
        }

        .upload-section.dragover {
            border-color: #667eea;
            background-color: #f0f4ff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4rem;
            color: #667eea;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 20px;
        }

        .file-input {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
            margin-top: 30px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            border-left: 5px solid #28a745;
        }

        .results h3 {
            color: #28a745;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: white;
            border-radius: 10px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .result-label {
            font-weight: 600;
            color: #333;
        }

        .result-value {
            color: #667eea;
            font-weight: 500;
        }

        .json-files {
            margin-top: 20px;
        }

        .json-file {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .json-file:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .json-file h4 {
            color: #333;
            margin-bottom: 5px;
        }

        .json-file p {
            color: #666;
            font-size: 0.9rem;
        }

        .error {
            display: none;
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid #dc3545;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid #28a745;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 TSV Converter</h1>
            <p>Upload forensic report ZIP files and convert them to JSON format</p>
        </div>

        <div class="content">
            <form id="uploadForm">
                <div class="upload-section" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">
                        <strong>Drop your ZIP file here</strong><br>
                        or click to browse
                    </div>
                    <input type="file" id="zipFile" class="file-input" accept=".zip" required>
                    <button type="button" class="btn" onclick="document.getElementById('zipFile').click()">
                        Choose ZIP File
                    </button>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="caseId">Case ID (Optional)</label>
                        <input type="text" id="caseId" placeholder="e.g., CASE-2024-001" value="AUTO-CASE-001">
                    </div>
                    <div class="form-group">
                        <label for="deviceId">Device ID (Optional)</label>
                        <input type="text" id="deviceId" placeholder="e.g., DEVICE-001" value="AUTO-DEVICE-001">
                    </div>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="syncMode" style="margin-right: 10px;">
                        Use Sync Mode (returns JSON data directly)
                    </label>
                </div>

                <button type="submit" class="btn" id="uploadBtn">
                    🚀 Process Forensic Report
                </button>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing your forensic report...</p>
                <p style="color: #666; font-size: 0.9rem;">This may take a few minutes</p>
            </div>

            <div class="error" id="error"></div>
            <div class="results" id="results"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        const uploadForm = document.getElementById('uploadForm');
        const uploadArea = document.getElementById('uploadArea');
        const zipFileInput = document.getElementById('zipFile');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const error = document.getElementById('error');

        // Drag and drop functionality
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].name.endsWith('.zip')) {
                zipFileInput.files = files;
                updateUploadDisplay(files[0].name);
            }
        });

        // File input change
        zipFileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                updateUploadDisplay(e.target.files[0].name);
            }
        });

        function updateUploadDisplay(fileName) {
            const uploadText = uploadArea.querySelector('.upload-text');
            uploadText.innerHTML = `<strong>Selected:</strong> ${fileName}`;
            uploadArea.style.borderColor = '#28a745';
            uploadArea.style.backgroundColor = '#f8fff8';
        }

        // Form submission
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            const zipFile = zipFileInput.files[0];
            const caseId = document.getElementById('caseId').value;
            const deviceId = document.getElementById('deviceId').value;
            const syncMode = document.getElementById('syncMode').checked;

            if (!zipFile) {
                showError('Please select a ZIP file');
                return;
            }

            formData.append('zip_file', zipFile);
            formData.append('case_id', caseId);
            formData.append('device_id', deviceId);

            showLoading();
            hideError();
            hideResults();

            try {
                const endpoint = syncMode ? '/process-forensic-report-sync' : '/process-forensic-report';
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showResults(data.results, syncMode);
                } else {
                    showError(data.error || 'Processing failed');
                }
            } catch (err) {
                showError(`Network error: ${err.message}`);
            } finally {
                hideLoading();
            }
        });

        function showLoading() {
            loading.style.display = 'block';
            document.getElementById('uploadBtn').disabled = true;
        }

        function hideLoading() {
            loading.style.display = 'none';
            document.getElementById('uploadBtn').disabled = false;
        }

        function showError(message) {
            error.textContent = message;
            error.style.display = 'block';
        }

        function hideError() {
            error.style.display = 'none';
        }

        function hideResults() {
            results.style.display = 'none';
        }

        function showResults(data, syncMode) {
            results.innerHTML = `
                <h3>✅ Processing Complete!</h3>
                
                <div class="result-item">
                    <span class="result-label">Case ID:</span>
                    <span class="result-value">${data.case_id}</span>
                </div>
                
                <div class="result-item">
                    <span class="result-label">Device ID:</span>
                    <span class="result-value">${data.device_id}</span>
                </div>
                
                <div class="result-item">
                    <span class="result-label">ZIP File:</span>
                    <span class="result-value">${data.zip_filename}</span>
                </div>
                
                <div class="result-item">
                    <span class="result-label">TSV Files Processed:</span>
                    <span class="result-value">${data.tsv_files_processed}</span>
                </div>
                
                <div class="result-item">
                    <span class="result-label">Total Records:</span>
                    <span class="result-value">${data.total_records.toLocaleString()}</span>
                </div>
                
                <div class="result-item">
                    <span class="result-label">JSON Files Created:</span>
                    <span class="result-value">${data.json_files_created}</span>
                </div>
                
                <div class="result-item">
                    <span class="result-label">Processing Time:</span>
                    <span class="result-value">${data.processing_time.toFixed(2)} seconds</span>
                </div>
                
                ${data.permanent_output_path ? `
                <div class="result-item">
                    <span class="result-label">Output Directory:</span>
                    <span class="result-value">${data.permanent_output_path}</span>
                </div>
                ` : ''}
                
                ${syncMode && data.conversion_report ? `
                <div class="json-files">
                    <h4>📄 Conversion Report</h4>
                    <div class="json-file" onclick="showJsonData('conversion', ${JSON.stringify(data.conversion_report).replace(/"/g, '&quot;')})">
                        <h4>Conversion Statistics</h4>
                        <p>Click to view detailed conversion report</p>
                    </div>
                </div>
                ` : ''}
                
                <div class="success">
                    🎉 Your forensic report has been successfully processed and converted to JSON format!
                    ${data.permanent_output_path ? `Files are saved in: ${data.permanent_output_path}` : ''}
                </div>
            `;
            
            results.style.display = 'block';
        }

        function showJsonData(type, data) {
            const jsonStr = JSON.stringify(data, null, 2);
            const newWindow = window.open('', '_blank');
            newWindow.document.write(`
                <html>
                    <head>
                        <title>${type} Report</title>
                        <style>
                            body { font-family: monospace; padding: 20px; background: #f5f5f5; }
                            pre { background: white; padding: 20px; border-radius: 5px; overflow-x: auto; }
                        </style>
                    </head>
                    <body>
                        <h2>${type} Report</h2>
                        <pre>${jsonStr}</pre>
                    </body>
                </html>
            `);
        }

        // Initialize
        console.log('TSV Converter Frontend loaded');
    </script>
</body>
</html>
